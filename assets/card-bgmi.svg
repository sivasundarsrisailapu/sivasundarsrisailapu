<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="BGMI Promo Reel">
<style>
  .paper { animation: peek 4s ease-in-out infinite; }
  .paper2 { animation: peek 4s ease-in-out .6s infinite; }
  .live { transform-box: fill-box; transform-origin: center; animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes peek { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes ping { 75%,100% { transform: scale(2.6); opacity: 0; } }
</style>
<defs>
  
</defs>
<!-- folder back + tab -->
<path d="M0 22 Q0 0 22 0 H190 Q204 0 210 12 L218 26 H538 Q560 26 560 48 V278 Q560 300 538 300 H22 Q0 300 0 278 Z" fill="#1A4A2E"/>
<text x="24" y="20" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="rgba(255,255,255,0.72)">04 / BGMI</text>

<!-- papers peeking out -->
<g class="paper2"><rect x="52" y="40" width="440" height="90" rx="12" fill="#EFEDE6" transform="rotate(-2 272 85)"/></g>
<g class="paper"><rect x="40" y="48" width="480" height="90" rx="12" fill="#FDFDFB"/>
  <rect x="64" y="66" width="190" height="8" rx="4" fill="#E7E3D9"/><rect x="64" y="84" width="120" height="8" rx="4" fill="#E7E3D9"/></g>
<!-- folder front -->
<rect y="92" width="560" height="208" rx="26" fill="#2A6B45"/>
<rect y="92" width="560" height="208" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"/>
<g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text x="30" y="132" font-size="13" font-weight="700" letter-spacing="1.4" fill="rgba(255,255,255,0.72)">VIDEO EDITING</text>
  <text x="30" y="178" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">BGMI Promo</text>
  <text x="30" y="218" font-size="34" font-weight="800" letter-spacing="-0.8" fill="#FFFFFF">Reel</text>
  <rect x="30" y="242" width="59.6" height="28" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <text x="59.8" y="261" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2026</text>
  <text x="103.6" y="261" font-size="14" font-weight="600" fill="rgba(255,255,255,0.72)">Voiceover + beat-synced edit</text>
</g>
